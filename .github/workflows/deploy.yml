name: Deploy to Cloud Run

on:
  workflow_dispatch:

env:
  PROJECT_ID: personal-agent-494817
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/personal-agent-494817/sage/app

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.IMAGE }}:latest \
            .

      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          SAGE_PUBLIC_URL: ${{ secrets.SAGE_PUBLIC_URL }}
          SAGE_USERNAME: ${{ secrets.SAGE_USERNAME }}
          SAGE_PASSPHRASE: ${{ secrets.SAGE_PASSPHRASE }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
          YOUR_WHATSAPP_NUMBER: ${{ secrets.YOUR_WHATSAPP_NUMBER }}
          WHATSAPP_ENABLED: ${{ secrets.WHATSAPP_ENABLED }}
        run: |
          ENV_VARS="DATABASE_URL=${DATABASE_URL}"
          ENV_VARS="${ENV_VARS},GROQ_API_KEY=${GROQ_API_KEY}"
          ENV_VARS="${ENV_VARS},GEMINI_API_KEY=${GEMINI_API_KEY}"
          ENV_VARS="${ENV_VARS},HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}"
          ENV_VARS="${ENV_VARS},ORCHESTRATOR_CHAT_MODEL=gemini:gemini-2.5-flash"
          ENV_VARS="${ENV_VARS},ACTION_CHAT_MODEL=gemini:gemini-2.5-flash"
          ENV_VARS="${ENV_VARS},EMBEDDINGS_PROVIDER=sentence-transformers"
          ENV_VARS="${ENV_VARS},HUGGINGFACE_EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2"
          ENV_VARS="${ENV_VARS},EMBEDDING_DIMENSION=384"
          ENV_VARS="${ENV_VARS},DATA_DIR=/tmp/sage-data"
          ENV_VARS="${ENV_VARS},ASSISTANT_NAME=Sage"
          ENV_VARS="${ENV_VARS},WHATSAPP_ENABLED=${WHATSAPP_ENABLED:-true}"
          if [ -n "${SAGE_USERNAME}" ]; then
            ENV_VARS="${ENV_VARS},SAGE_USERNAME=${SAGE_USERNAME}"
          fi
          if [ -n "${SAGE_PASSPHRASE}" ]; then
            ENV_VARS="${ENV_VARS},SAGE_PASSPHRASE=${SAGE_PASSPHRASE}"
          fi
          if [ -n "${TWILIO_ACCOUNT_SID}" ]; then
            ENV_VARS="${ENV_VARS},TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}"
          fi
          if [ -n "${TWILIO_AUTH_TOKEN}" ]; then
            ENV_VARS="${ENV_VARS},TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}"
          fi
          if [ -n "${TWILIO_WHATSAPP_NUMBER}" ]; then
            ENV_VARS="${ENV_VARS},TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER}"
          fi
          if [ -n "${YOUR_WHATSAPP_NUMBER}" ]; then
            ENV_VARS="${ENV_VARS},YOUR_WHATSAPP_NUMBER=${YOUR_WHATSAPP_NUMBER}"
          fi
          if [ -n "${GOOGLE_CLIENT_SECRETS_JSON}" ]; then
            ENV_VARS="${ENV_VARS},GOOGLE_CLIENT_SECRETS_JSON=${GOOGLE_CLIENT_SECRETS_JSON}"
          fi
          if [ -n "${SAGE_PUBLIC_URL}" ]; then
            ENV_VARS="${ENV_VARS},SAGE_PUBLIC_URL=${SAGE_PUBLIC_URL}"
          fi
          gcloud run deploy sage \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 2Gi \
            --cpu 1 \
            --timeout 300 \
            --min-instances 1 \
            --set-env-vars "${ENV_VARS}"

      - name: Print service URL
        run: |
          gcloud run services describe sage \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format "value(status.url)"
