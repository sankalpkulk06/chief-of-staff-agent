<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1000" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c858b"/>
    </marker>
    <marker id="arrowA" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e0a23c"/>
    </marker>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57c08a"/>
    </marker>
    <style>
      .box  { fill:#13181b; stroke:#c9d1d6; stroke-width:1.3; }
      .agent{ fill:#141b1f; stroke:#aeb8bf; stroke-width:1.3; }
      .svc  { fill:#11161a; stroke:#5f6b72; stroke-width:1.2; }
      .store{ fill:#101619; stroke:#e0a23c; stroke-width:1.4; }
      .hitl { fill:#1a1712; stroke:#e0a23c; stroke-width:1.4; }
      .t    { fill:#eef2f4; font-size:14px; font-weight:600; }
      .ts   { fill:#eef2f4; font-size:13px; font-weight:600; }
      .s    { fill:#98a1a7; font-size:11px; }
      .sa   { fill:#e0a23c; font-size:11px; }
      .sg   { fill:#57c08a; font-size:11px; }
      .head { fill:#6b747a; font-size:11px; font-weight:600; letter-spacing:1.5px; }
      .edge { stroke:#7c858b; stroke-width:1.4; fill:none; marker-end:url(#arrow); }
      .edgeA{ stroke:#e0a23c; stroke-width:1.6; fill:none; marker-end:url(#arrowA); }
      .edgeG{ stroke:#57c08a; stroke-width:1.4; fill:none; marker-end:url(#arrowG); }
      .read { stroke:#5f6b72; stroke-width:1.2; fill:none; stroke-dasharray:5 4; marker-end:url(#arrow); }
      .lbl  { fill:#aeb8bf; font-size:10.5px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1760" height="1000" fill="#0b0d0e"/>
  <text x="40" y="42" fill="#eef2f4" font-size="20" font-weight="700">Sage — Chief of Staff Agent · System Architecture</text>
  <text x="40" y="63" class="s">Multi-agent · plan → dispatch → synthesize · human-in-the-loop writes · dual local/cloud storage</text>

  <!-- ================= MAIN PIPELINE ================= -->
  <!-- Clients -->
  <rect class="box" x="34" y="250" width="150" height="150" rx="9"/>
  <text class="t" x="52" y="278">Clients</text>
  <text class="s" x="52" y="304">• Web (SPA)</text>
  <text class="s" x="52" y="324">• WhatsApp (Twilio)</text>
  <text class="s" x="52" y="344">• CLI (`sage`)</text>
  <text class="s" x="52" y="378">one shared core</text>

  <!-- Gateway -->
  <rect class="box" x="224" y="238" width="176" height="174" rx="9"/>
  <text class="t" x="242" y="266">Gateway · FastAPI</text>
  <text class="s" x="242" y="292">• REST /api/v1</text>
  <text class="s" x="242" y="312">• Auth (PBKDF2)</text>
  <text class="s" x="242" y="332">• Webhook (Twilio-signed)</text>
  <text class="s" x="242" y="352">• Trace stream (SSE)</text>
  <text class="s" x="242" y="386">→ Scheduler (below)</text>

  <!-- Security Agent -->
  <rect class="box" x="440" y="214" width="196" height="222" rx="9"/>
  <text class="t" x="458" y="242">Security Agent</text>
  <text class="head" x="458" y="266">INPUT GATE</text>
  <text class="s" x="458" y="286">• rate limit · length</text>
  <text class="s" x="458" y="306">• HTML sanitize</text>
  <text class="s" x="458" y="326">• injection regex + LLM</text>
  <text class="s" x="458" y="346">• PII detect (soft)</text>
  <text class="head" x="458" y="374">OUTPUT SCRUB</text>
  <text class="s" x="458" y="394">• secret redaction</text>
  <text class="s" x="458" y="414">• length trim</text>

  <!-- Orchestrator -->
  <rect class="box" x="676" y="238" width="184" height="174" rx="9"/>
  <text class="t" x="694" y="266">Orchestrator Agent</text>
  <text class="s" x="694" y="292">• plan()</text>
  <text class="s" x="694" y="312">• dispatch() — parallel</text>
  <text class="s" x="694" y="332">• synthesize()</text>
  <text class="s" x="694" y="366">deterministic guards:</text>
  <text class="s" x="694" y="386">email · calorie · log</text>

  <line class="edge" x1="184" y1="325" x2="222" y2="325"/>
  <line class="edge" x1="400" y1="325" x2="438" y2="325"/>
  <line class="edge" x1="636" y1="325" x2="674" y2="325"/>

  <!-- ================= AGENT FAN-OUT BUS ================= -->
  <!-- bus from orchestrator -->
  <path class="edge" d="M860,325 L892,325" marker-end="none"/>
  <path d="M892,116 L892,536" stroke="#7c858b" stroke-width="1.4" fill="none"/>

  <!-- Agents (x 912..1062) -->
  <!-- Action -->
  <rect class="agent" x="912" y="88" width="152" height="56" rx="8"/>
  <text class="ts" x="988" y="112" text-anchor="middle">Action Agent</text>
  <text class="s" x="988" y="130" text-anchor="middle">todos·habits·facts·food</text>
  <line class="edge" x1="892" y1="116" x2="910" y2="116"/>
  <!-- RAG -->
  <rect class="agent" x="912" y="172" width="152" height="56" rx="8"/>
  <text class="ts" x="988" y="196" text-anchor="middle">RAG Agent</text>
  <text class="s" x="988" y="214" text-anchor="middle">search saved docs</text>
  <line class="edge" x1="892" y1="200" x2="910" y2="200"/>
  <!-- Research -->
  <rect class="agent" x="912" y="256" width="152" height="56" rx="8"/>
  <text class="ts" x="988" y="280" text-anchor="middle">Research Agent</text>
  <text class="s" x="988" y="298" text-anchor="middle">web · news</text>
  <line class="edge" x1="892" y1="284" x2="910" y2="284"/>
  <!-- Conversational -->
  <rect class="agent" x="912" y="340" width="152" height="56" rx="8"/>
  <text class="ts" x="988" y="364" text-anchor="middle">Conversational</text>
  <text class="s" x="988" y="382" text-anchor="middle">chat · synthesis</text>
  <line class="edge" x1="892" y1="368" x2="910" y2="368"/>
  <!-- Email -->
  <rect class="agent" x="912" y="424" width="152" height="56" rx="8"/>
  <text class="ts" x="988" y="448" text-anchor="middle">Email Agent</text>
  <text class="s" x="988" y="466" text-anchor="middle">read · triage</text>
  <line class="edge" x1="892" y1="452" x2="910" y2="452"/>
  <!-- Planner -->
  <rect class="agent" x="912" y="508" width="152" height="56" rx="8"/>
  <text class="ts" x="988" y="532" text-anchor="middle">Planner Agent</text>
  <text class="s" x="988" y="550" text-anchor="middle">day / calendar plan</text>
  <line class="edge" x1="892" y1="536" x2="910" y2="536"/>

  <!-- ================= SERVICES (x 1092..1352) ================= -->
  <!-- Action services -->
  <rect class="svc" x="1092" y="80" width="262" height="72" rx="8"/>
  <text class="t" x="1108" y="102">Personal-data services</text>
  <text class="s" x="1108" y="122">Habit · Fact · Todo</text>
  <text class="sa" x="1108" y="140">Calorie — intake · burned · macros</text>
  <line class="edge" x1="1064" y1="116" x2="1090" y2="116"/>
  <!-- RAG service -->
  <rect class="svc" x="1092" y="172" width="262" height="56" rx="8"/>
  <text class="t" x="1108" y="194">Retriever + Ingestion</text>
  <text class="s" x="1108" y="214">embeddings · vector search · chunking</text>
  <line class="edge" x1="1064" y1="200" x2="1090" y2="200"/>
  <!-- Research external -->
  <rect class="svc" x="1092" y="256" width="262" height="56" rx="8"/>
  <text class="t" x="1108" y="278">Web &amp; News</text>
  <text class="s" x="1108" y="298">Tavily / DuckDuckGo · RSS news</text>
  <line class="edge" x1="1064" y1="284" x2="1090" y2="284"/>
  <!-- Email service -->
  <rect class="svc" x="1092" y="424" width="262" height="56" rx="8"/>
  <text class="t" x="1108" y="446">Gmail API</text>
  <text class="s" x="1108" y="466">Google OAuth (personal / work)</text>
  <line class="edge" x1="1064" y1="452" x2="1090" y2="452"/>
  <!-- Planner service -->
  <rect class="svc" x="1092" y="508" width="262" height="56" rx="8"/>
  <text class="t" x="1108" y="530">Calendar + Tasks</text>
  <text class="s" x="1108" y="550">Google Calendar · Google Tasks</text>
  <line class="edge" x1="1064" y1="536" x2="1090" y2="536"/>

  <!-- ================= HITL GATE ================= -->
  <rect class="hitl" x="1388" y="250" width="120" height="150" rx="9"/>
  <text class="ts" x="1448" y="300" text-anchor="middle">HITL Gate</text>
  <text class="sa" x="1448" y="322" text-anchor="middle">multi-item</text>
  <text class="s" x="1448" y="342" text-anchor="middle">web cards</text>
  <text class="s" x="1448" y="360" text-anchor="middle">CLI [y/n]</text>
  <text class="s" x="1448" y="378" text-anchor="middle">WA queue</text>

  <!-- writes: Action services + Planner services -> HITL -->
  <path class="edgeA" d="M1354,116 L1371,116 L1371,290 L1386,290"/>
  <path class="edgeA" d="M1354,536 L1371,536 L1371,360 L1386,360"/>

  <!-- ================= STORAGE ================= -->
  <rect class="store" x="1540" y="120" width="196" height="452" rx="12"/>
  <text class="t" x="1560" y="150">Storage Layer</text>
  <text class="s" x="1560" y="174">Local: SQLite + ChromaDB</text>
  <text class="s" x="1560" y="192">Cloud: Postgres + pgvector</text>
  <text class="s" x="1560" y="210">(one factory; parity)</text>
  <text class="head" x="1560" y="240">TABLES</text>
  <text class="s" x="1560" y="262">users · sessions · turns</text>
  <text class="s" x="1560" y="282">chunks · learned_facts</text>
  <text class="s" x="1560" y="302">habits · habit_logs</text>
  <text class="s" x="1560" y="322">todos · calorie_entries</text>
  <text class="s" x="1560" y="342">hitl_requests</text>
  <text class="s" x="1560" y="362">pending_prompts</text>
  <text class="s" x="1560" y="382">sage_calendar_events</text>
  <text class="s" x="1560" y="402">security_events</text>
  <text class="s" x="1560" y="422">agent_invocations</text>
  <text class="s" x="1560" y="442">user_settings · tokens</text>

  <!-- HITL -> storage (write) -->
  <path class="edgeA" d="M1508,325 L1538,325"/>
  <text class="sa" x="1512" y="318">write</text>
  <!-- RAG ingestion -> storage -->
  <path class="edge" d="M1354,200 L1538,200"/>
  <!-- read: conversational agent → storage (dashed), routed through the empty service gap -->
  <path class="read" d="M1064,368 L1362,368 L1362,486 L1538,486"/>
  <text class="lbl" x="1372" y="502">read</text>

  <!-- ================= BOTTOM BAND ================= -->
  <!-- Analytics -->
  <rect class="box" x="912" y="616" width="262" height="72" rx="9"/>
  <text class="t" x="928" y="640">Analytics Service</text>
  <text class="s" x="928" y="660">dashboard · deltas · streaks · macros</text>
  <text class="s" x="928" y="678">insights (LLM) · /stats text digest</text>
  <path class="read" d="M1174,652 L1420,652 L1420,520 L1538,520"/>

  <!-- Ragas -->
  <rect class="box" x="676" y="470" width="184" height="70" rx="9"/>
  <text class="t" x="694" y="494">Ragas Service</text>
  <text class="s" x="694" y="514">RAG turns only</text>
  <text class="s" x="694" y="532">faithfulness · relevancy</text>
  <line class="edge" x1="768" y1="412" x2="768" y2="468"/>

  <!-- Scheduler -->
  <rect class="box" x="224" y="470" width="234" height="96" rx="9"/>
  <text class="t" x="242" y="494">Scheduler · APScheduler</text>
  <text class="s" x="242" y="514">• morning briefing (08:00)</text>
  <text class="s" x="242" y="534">• habit nudges (21:00)</text>
  <text class="s" x="242" y="554">• due-todo reminders</text>
  <line class="edge" x1="312" y1="412" x2="312" y2="468"/>
  <path class="edgeG" d="M224,540 L110,540 L110,402"/>
  <text class="sg" x="118" y="560">push → WhatsApp</text>

  <!-- LLM legend -->
  <rect x="34" y="616" width="600" height="150" rx="9" fill="#0f1315" stroke="#242a2d" stroke-width="1"/>
  <text class="head" x="52" y="642">MODELS</text>
  <text class="s" x="52" y="666">Orchestrator · Action  →  Gemini 2.5 Flash</text>
  <text class="s" x="52" y="686">Sub-agents  →  Groq Llama 3.3 70B</text>
  <text class="s" x="52" y="706">Fallback chain  →  Gemini → Groq (→ Ollama)</text>
  <text class="s" x="52" y="726">Embeddings  →  sentence-transformers (in-process)</text>
  <text class="s" x="52" y="746">Structured calls  →  native tool-calling (Gemini/Groq) · prompt→JSON fallback (Ollama)</text>

  <text class="head" x="360" y="642">CROSS-CUTTING</text>
  <text class="s" x="360" y="666">• per-user timezone-aware dates</text>
  <text class="s" x="360" y="686">• structured output = native tools (fallback: prompt→JSON)</text>
  <text class="s" x="360" y="706">• compute-on-read analytics</text>
  <text class="s" x="360" y="726">• single-tenant auth (shared passphrase)</text>

  <!-- footer -->
  <text class="lbl" x="1300" y="612">solid = request/write · dashed = read · amber = HITL write · green = scheduled push</text>
  <text class="lbl" x="40" y="978">Deploy: Docker / GCP Cloud Run · migrations in scripts/migrations · frontend = single-file SPA</text>
</svg>
